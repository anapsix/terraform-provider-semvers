name: test
on:
  pull_request:
  push:
    branches:
    - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    -
      name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    -
      name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    -
      name: Verify modules
      run: go mod verify
    -
      name: Check formatting
      run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
    -
      name: Vet
      run: go vet ./...
    -
      name: Build
      run: go build -v ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    -
      name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    -
      name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    -
      name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        # keep in sync with .pre-commit-config.yaml
        version: v2.12.2

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    -
      name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    -
      name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    -
      name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        # pinned so a new `terraform fmt` style can't fail this job without a code change;
        # keep in sync with the newest version in the test matrix
        terraform_version: '1.17.*'
        terraform_wrapper: false
    -
      name: Generate docs and format examples
      run: go generate ./...
    -
      name: Check for uncommitted changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          git status --short
          git diff
          echo "::error::Generated files are out of date. Run 'go generate ./...' and commit the result."
          exit 1
        fi

  test:
    name: test (terraform ${{ matrix.terraform }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 1.8 is the minimum version supporting provider-defined functions
        terraform:
        - '1.8.*'
        - '1.12.*'
        - '1.17.*'
    steps:
    -
      name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    -
      name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    -
      name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ matrix.terraform }}
        terraform_wrapper: false
    -
      name: Run acceptance tests
      env:
        TF_ACC: '1'
      run: go test -v -cover -count=1 ./...
