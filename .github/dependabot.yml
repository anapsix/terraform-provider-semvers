version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  # one PR for all action bumps; pinned SHAs and their version comments are updated together
  groups:
    github-actions:
      patterns:
      - '*'
  commit-message:
    # trailing space: without it Dependabot appends a colon after the closing bracket
    prefix: '[chore] '
